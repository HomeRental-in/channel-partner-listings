# Production: pull-only. The image is built by GitHub Actions (.github/workflows/build-image.yml).
# Database = RDS (DATABASE_URL in .env.production), uploads = S3 (STORAGE_DRIVER=s3) or the local volume.
#   docker login ghcr.io -u <github-user> -p <PAT with read:packages>
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
services:
  app:
    image: ghcr.io/homerental-in/channel-partner-listings:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/public/uploads
    deploy:
      resources:
        limits:
          memory: 1200m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  uploads:
