# Production: pull-only. GitHub Actions builds the image and pushes it to ECR (no registry tokens; the instance role pulls).
# Database = RDS (DATABASE_URL in .env.production), uploads = S3 (STORAGE_DRIVER=s3) or the local volume.
#   aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 247839622447.dkr.ecr.ap-south-1.amazonaws.com
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
services:
  app:
    image: 247839622447.dkr.ecr.ap-south-1.amazonaws.com/estateinfo:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/public/uploads
    deploy:
      resources:
        limits:
          memory: 1200m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  uploads:
