# /etc/nginx/sites-available/estateinfo — as deployed on estateinfo-ec2 (wildcard cert from certbot --dns-route53).
server {
    listen 80; listen [::]:80;
    server_name estateinfo.in *.estateinfo.in;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name estateinfo.in *.estateinfo.in;
    ssl_certificate /etc/letsencrypt/live/estateinfo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/estateinfo.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3; ssl_prefer_server_ciphers off; ssl_session_cache shared:SSL:10m; ssl_session_timeout 1d;
    client_max_body_size 120m;          # video uploads up to 100 MB
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;                  # the app routes on the Host header
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;                      # brochure ingestion / video conversion
    }
}
