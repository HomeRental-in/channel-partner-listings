# /etc/nginx/sites-available/youraddress — wildcard host for every CP subdomain.
# TLS: Cloudflare in front (recommended, see docs/DEPLOY.md) or a wildcard cert from certbot DNS-01.
server {
    listen 80;
    listen [::]:80;
    server_name youraddress.in *.youraddress.in;
    client_max_body_size 120m;          # video uploads up to 100 MB

    location /uploads/ {                 # serve stored files straight from the volume
        alias /var/lib/docker/volumes/channel-partner-listings_uploads/_data/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;                  # required: the app routes on the Host header
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-IPCity $http_cf_ipcity;   # coarse city for analytics when Cloudflare is in front
        proxy_read_timeout 180s;                      # brochure ingestion / video conversion
    }
}
